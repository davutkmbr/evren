<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>sandbox · street</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec3e6; }
      #app { position: fixed; inset: 0; }
      #app canvas { position: absolute; inset: 0; display: block; outline: none; }
      .street-hud {
        position: absolute; left: 12px; top: 10px; pointer-events: none; white-space: pre;
        font: 12px/1.5 ui-monospace, Menlo, monospace; color: #eef3f8;
        background: rgba(10, 14, 20, 0.62); padding: 7px 10px; border-radius: 6px;
        font-variant-numeric: tabular-nums;
      }
      .street-attrib {
        position: absolute; right: 8px; bottom: 6px; pointer-events: none;
        font: 11px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: rgba(20, 24, 30, 0.8);
        background: rgba(255, 255, 255, 0.55); padding: 2px 6px; border-radius: 4px;
      }
    </style>
  </head>
  <body><div id="app"></div><script type="module" src="./street.ts"></script></body>
</html>
